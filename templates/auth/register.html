{% extends "base.html" %}

{% block title %}Create Account — TrackMyCourse{% endblock %}

{% block extra_head %}
<style>
    .auth-container {
        max-width: 520px;
        margin: 30px auto;
        background: white;
        padding: 35px 30px;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .auth-title {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--dark);
        margin-bottom: 6px;
        text-align: center;
    }

    .auth-subtitle {
        color: var(--gray);
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    @media (max-width: 600px) {
        .form-row { grid-template-columns: 1fr; }
    }

    .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--gray);
        margin-bottom: 6px;
    }

    .form-input, .form-select {
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1.5px solid var(--light-gray);
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: var(--transition);
    }

    .form-input:focus, .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
    }

    .auth-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--gray);
    }

    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Begin Your Academic Journey</h2>
    <p class="auth-subtitle">Create your personal student tracking account</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label class="form-label" for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-input" required placeholder="John Doe">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="johndoe">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="john@example.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="university_id">University</label>
                <select id="university_id" name="university_id" class="form-select">
                    {% for u in universities %}
                        <option value="{{ u.id }}">{{ u.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="program_id">Program</label>
                <select id="program_id" name="program_id" class="form-select">
                    {% for p in programs %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="Repeat password">
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:10px;">
            Create Student Account &rarr;
        </button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
</div>
{% endblock %}
