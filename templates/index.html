<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Course</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        select {
            width: 320px;
            padding: 6px;
            margin-top: 5px;
        }
        h3 {
            margin-top: 25px;
        }
        .topic {
            margin-left: 15px;
        }
        #progressBox {
            margin-top: 25px;
        }
        #progressBarOuter {
            width: 320px;
            height: 10px;
            background: #eee;
            margin-top: 6px;
        }
        #progressBar {
            height: 10px;
            width: 0%;
            background: #4caf50;
        }
    </style>
</head>
<body>

<h2>Track My Course</h2>

<label for="university">University</label>
<select id="university" title="Select University">
    <option value="">Select University</option>
</select>

<label for="program">Program</label>
<select id="program" title="Select Program">
    <option value="">Select Program</option>
</select>

<label for="stream">Stream</label>
<select id="stream" title="Select Stream">
    <option value="">Select Stream</option>
</select>

<label for="scheme">Scheme</label>
<select id="scheme" title="Select Scheme">
    <option value="">Select Scheme</option>
</select>

<label for="semester">Semester</label>
<select id="semester" title="Select Semester">
    <option value="">Select Semester</option>
</select>

<label for="course">Course</label>
<select id="course" title="Select Course">
    <option value="">Select Course</option>
</select>

<!-- SYLLABUS DISPLAY -->
<div id="syllabus"></div>

<!-- PROGRESS -->
<div id="progressBox">
    <strong>Progress: <span id="progressText">0%</span></strong>
    <div id="progressBarOuter">
        <div id="progressBar"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const BASE = "http://127.0.0.1:5000";

    const uni = document.getElementById("university");
    const prog = document.getElementById("program");
    const stream = document.getElementById("stream");
    const scheme = document.getElementById("scheme");
    const sem = document.getElementById("semester");
    const course = document.getElementById("course");
    const syllabusDiv = document.getElementById("syllabus");

    // ---------- Load Universities ----------
    fetch(`${BASE}/api/universities`)
        .then(res => res.json())
        .then(data => {
            data.forEach(u => {
                uni.innerHTML += `<option value="${u.id}">${u.name}</option>`;
            });
        });

    // ---------- University → Program ----------
    uni.onchange = () => {
        resetBelow("program");
        fetch(`${BASE}/api/programs?university_id=${uni.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(p => {
                    prog.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                });
            });
    };

    // ---------- Program → Stream / Scheme ----------
    prog.onchange = () => {
        resetBelow("stream");
        fetch(`${BASE}/api/streams?program_id=${prog.value}`)
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    loadSchemes();
                } else {
                    data.forEach(s => {
                        stream.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                    });
                }
            });
    };

    stream.onchange = () => loadSchemes(stream.value);

    function loadSchemes(streamId="") {
        resetBelow("scheme");
        let url = `${BASE}/api/schemes?program_id=${prog.value}`;
        if (streamId) url += `&stream_id=${streamId}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                data.forEach(sc => {
                    scheme.innerHTML += `<option value="${sc.id}">${sc.year}</option>`;
                });
            });
    }

    // ---------- Scheme → Semester ----------
    scheme.onchange = () => {
        resetBelow("semester");
        fetch(`${BASE}/api/semesters?scheme_id=${scheme.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(s => {
                    sem.innerHTML += `<option value="${s.id}">Semester ${s.semester_no}</option>`;
                });
            });
    };

    // ---------- Semester → Course ----------
    sem.onchange = () => {
        resetBelow("course");
        fetch(`${BASE}/api/courses?semester_id=${sem.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(c => {
                    course.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
            });
    };

    // ---------- Course → Syllabus ----------
    course.onchange = () => {
        syllabusDiv.innerHTML = "";
        fetch(`${BASE}/api/syllabus?course_id=${course.value}`)
            .then(res => res.json())
            .then(data => {
                let total = 0;

                data.forEach(m => {
                    syllabusDiv.innerHTML += `<h3>${m.module} (${m.hours} hrs)</h3>`;
                    m.topics.forEach(t => {
                        total++;
                        syllabusDiv.innerHTML += `
                            <div class="topic">
                                <input type="checkbox" class="topicCheck">
                                ${t}
                            </div>
                        `;
                    });
                });

                const checks = document.querySelectorAll(".topicCheck");
                checks.forEach(c => {
                    c.onchange = () => {
                        const completed = document.querySelectorAll(".topicCheck:checked").length;
                        const percent = Math.round((completed / total) * 100);
                        document.getElementById("progressText").innerText = percent + "%";
                        document.getElementById("progressBar").style.width = percent + "%";
                    };
                });
            });
    };

    function resetBelow(level) {
        if (level === "program") prog.innerHTML = '<option value="">Select Program</option>';
        if (["program","stream"].includes(level)) stream.innerHTML = '<option value="">Select Stream</option>';
        if (["program","stream","scheme"].includes(level)) scheme.innerHTML = '<option value="">Select Scheme</option>';
        if (["program","stream","scheme","semester"].includes(level)) sem.innerHTML = '<option value="">Select Semester</option>';
        if (["program","stream","scheme","semester","course"].includes(level)) course.innerHTML = '<option value="">Select Course</option>';
        syllabusDiv.innerHTML = "";
        document.getElementById("progressText").innerText = "0%";
        document.getElementById("progressBar").style.width = "0%";
    }
});
</script>

</body>
</html>
