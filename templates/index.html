<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Course</title>

    <style>
        /* ===== MODERN CSS RESET & BASE STYLES ===== */
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3a0ca3;
            --secondary: #4cc9f0;
            --accent: #7209b7;
            --success: #4caf50;
            --warning: #f8961e;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        /* ===== MAIN HEADER ===== */
        h2 {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            padding: 40px 20px 30px;
            margin: 0;
            background: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 10;
        }

        h2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, 
                var(--primary) 0%, 
                var(--secondary) 50%, 
                var(--accent) 100%);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        /* ===== MAIN LAYOUT ===== */
        .layout {
            display: flex;
            height: calc(100vh - 120px);
            padding: 0;
            position: relative;
        }

        /* ===== SIDEBAR STYLING ===== */
        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            padding: 30px 25px;
            overflow-y: auto;
            position: relative;
            z-index: 5;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.03);
        }

        #sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, 
                transparent, 
                rgba(0, 0, 0, 0.1), 
                transparent);
        }

        #sidebar h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 25px 0;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light-gray);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #sidebar h3::before {
            content: '📁';
            font-size: 1.3rem;
            opacity: 0.8;
        }

        #fileList {
            list-style: none;
        }

        #fileList li {
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            background: var(--light);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        #fileList li::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        #fileList li:hover {
            background: rgba(67, 97, 238, 0.08);
            transform: translateX(4px);
            border-color: rgba(67, 97, 238, 0.15);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.1);
        }

        #fileList li:hover::before {
            transform: scaleY(1);
        }

        #fileList li:first-child {
            background: rgba(67, 97, 238, 0.05);
            border: 1px dashed rgba(67, 97, 238, 0.3);
        }

        #fileList li:first-child:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        /* ===== FILE VIEWER ===== */
        #viewer {
            flex: 1;
            padding: 30px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        #viewer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 0, 0, 0.1), 
                transparent);
        }

        #fileViewer {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            background: white;
        }

        /* ===== RIGHT CONTENT AREA ===== */
        .right-content {
            width: 380px;
            background: white;
            padding: 30px;
            overflow-y: auto;
            border-left: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 5;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.03);
        }

        .right-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, 
                transparent, 
                rgba(0, 0, 0, 0.1), 
                transparent);
        }

        /* ===== COURSE TITLE IN RIGHT PANEL ===== */
        .right-content h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0 0 30px 0;
            padding: 18px 20px;
            background: linear-gradient(135deg, 
                rgba(67, 97, 238, 0.05) 0%, 
                rgba(76, 201, 240, 0.05) 100%);
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .right-content h3:hover {
            background: linear-gradient(135deg, 
                rgba(67, 97, 238, 0.1) 0%, 
                rgba(76, 201, 240, 0.1) 100%);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.1);
        }

        /* ===== SYLLABUS MODULE HEADINGS ===== */
        #syllabus h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            margin: 35px 0 20px 0;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            border-left: 4px solid var(--secondary);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        #syllabus h3::after {
            content: attr(data-hours);
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(76, 201, 240, 0.3);
        }

        #syllabus h3::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, 
                var(--secondary), 
                var(--primary));
        }

        /* ===== TOPIC ITEMS ===== */
        .topic {
            margin-left: 0;
            margin-bottom: 12px;
            padding: 18px 20px;
            background: white;
            border-radius: 10px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            border: 1px solid var(--light-gray);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }

        .topic:hover {
            transform: translateX(8px);
            border-color: rgba(67, 97, 238, 0.2);
            box-shadow: 0 6px 18px rgba(67, 97, 238, 0.1);
        }

        .topic::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--primary-light);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .topic:hover::before {
            transform: scaleY(1);
        }

        .topicCheck {
            width: 22px;
            height: 22px;
            margin-right: 18px;
            cursor: pointer;
            border-radius: 6px;
            border: 2px solid var(--gray);
            transition: var(--transition);
            position: relative;
            appearance: none;
            -webkit-appearance: none;
            flex-shrink: 0;
            background: white;
        }

        .topicCheck:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .topicCheck:checked {
            background-color: var(--success);
            border-color: var(--success);
            animation: checkAnim 0.3s ease;
        }

        @keyframes checkAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .topicCheck:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 13px;
        }

        /* ===== PROGRESS BOX ===== */
        #progressBox {
            margin-top: 50px;
            padding: 30px;
            background: linear-gradient(135deg, 
                rgba(67, 97, 238, 0.03) 0%, 
                rgba(76, 201, 240, 0.03) 100%);
            border-radius: var(--border-radius);
            border: 1px solid rgba(67, 97, 238, 0.1);
            position: relative;
            overflow: hidden;
        }

        #progressBox::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                var(--primary), 
                var(--secondary));
        }

        #progressBox strong {
            font-size: 1.3rem;
            color: var(--dark);
            display: block;
            margin-bottom: 20px;
            font-weight: 700;
        }

        #progressText {
            color: var(--primary);
            font-weight: 800;
            font-size: 2rem;
            margin-left: 8px;
            text-shadow: 0 2px 4px rgba(67, 97, 238, 0.1);
        }

        /* ===== PROGRESS BAR ===== */
        #progressBarOuter {
            width: 100%;
            height: 14px;
            background: var(--light-gray);
            margin-top: 20px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, 
                var(--primary) 0%, 
                var(--secondary) 100%);
            border-radius: 50px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        #progressBar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== SCROLLBAR STYLING ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, 
                var(--primary-light), 
                var(--primary));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, 
                var(--primary), 
                var(--primary-dark));
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #sidebar, #viewer, .right-content {
            animation: fadeInUp 0.6s ease-out;
        }

        .topic {
            animation: fadeInUp 0.4s ease-out;
            animation-fill-mode: both;
        }

        .topic:nth-child(1) { animation-delay: 0.1s; }
        .topic:nth-child(2) { animation-delay: 0.15s; }
        .topic:nth-child(3) { animation-delay: 0.2s; }
        .topic:nth-child(4) { animation-delay: 0.25s; }
        .topic:nth-child(5) { animation-delay: 0.3s; }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1200px) {
            .right-content {
                width: 350px;
            }
            
            #sidebar {
                width: 280px;
            }
        }

        @media (max-width: 992px) {
            .layout {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 120px);
            }
            
            #sidebar {
                width: 100%;
                height: 300px;
                border-right: none;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            }
            
            #viewer {
                height: 400px;
            }
            
            .right-content {
                width: 100%;
                height: auto;
                border-left: none;
                border-top: 1px solid rgba(0, 0, 0, 0.08);
            }
        }

        @media (max-width: 768px) {
            h2 {
                font-size: 2.2rem;
                padding: 30px 15px 25px;
            }
            
            #sidebar, #viewer, .right-content {
                padding: 25px 20px;
            }
            
            #sidebar h3 {
                font-size: 1.2rem;
            }
            
            .right-content h3 {
                font-size: 1.4rem;
            }
            
            #syllabus h3 {
                font-size: 1.15rem;
            }
            
            .topic {
                padding: 16px;
            }
            
            #progressBox {
                padding: 25px;
            }
            
            #progressText {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.9rem;
                padding: 25px 15px 20px;
            }
            
            #sidebar, #viewer, .right-content {
                padding: 20px 15px;
            }
            
            #fileList li {
                padding: 12px 14px;
            }
            
            .topic {
                padding: 14px;
            }
            
            #progressBox {
                padding: 20px;
            }
        }
/* ===== EMPTY FOLDER MESSAGE ===== */
#fileList .empty-folder {
    color: var(--gray);
    font-style: italic;
    padding: 25px 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.02);
    border-radius: var(--border-radius);
    border: 1px dashed rgba(0, 0, 0, 0.1);
    margin: 15px 0;
    cursor: default;
    pointer-events: none;
    font-size: 0.95rem;
    position: relative;
}

#fileList .empty-folder::before {
    content: '📁';
    font-size: 1.5rem;
    display: block;
    margin-bottom: 10px;
    opacity: 0.5;
}

#fileList .empty-folder:hover {
    background: rgba(0, 0, 0, 0.02);
    transform: none;
    border-color: rgba(0, 0, 0, 0.1);
    box-shadow: none;
}

#fileList .empty-folder::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(0, 0, 0, 0.1), 
        transparent);
}

/* ===== FILE LIST ITEMS ===== */
#fileList li {
    padding: 14px 16px;
    margin-bottom: 8px;
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
    background: var(--light);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
}

#fileList li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--primary);
    transform: scaleY(0);
    transition: transform 0.3s ease;
}

#fileList li:hover {
    background: rgba(67, 97, 238, 0.08);
    transform: translateX(4px);
    border-color: rgba(67, 97, 238, 0.15);
    box-shadow: 0 4px 12px rgba(67, 97, 238, 0.1);
}

#fileList li:hover::before {
    transform: scaleY(1);
}

/* ===== BACK BUTTON STYLING ===== */

        /* ===== LOADING STATE ===== */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body>

<h2><span class="gradient-text">Track My Course</span></h2>

<div class="layout">
    <!-- SIDEBAR -->
    <div id="sidebar">
        <h3>ADS Files</h3>
        <ul id="fileList"></ul>
    </div>

    <!-- FILE VIEWER -->
    <div id="viewer">
        <iframe id="fileViewer"></iframe>
    </div>

    <!-- RIGHT CONTENT -->
    <div style="flex:1" class="right-content">
        <h3 onclick="loadCourse(3)">Advanced Data Structures</h3>
        <div id="syllabus"></div>

        <div id="progressBox">
            <strong>Progress: <span id="progressText">0%</span></strong>
            <div id="progressBarOuter">
                <div id="progressBar"></div>
            </div>
        </div>
    </div>
</div>

<script>
/* 🔥 FEATURE TOGGLE */
const PERSONAL_MODE = true; // change to false later
</script>

<!-- ================================================= -->
<!-- PERSONAL MCA S1 UI (ACTIVE NOW) -->
<!-- ================================================= -->
<div id="personal-ui" style="display:none;">

    <!-- <h3>📘 MCA – Semester 1</h3>

    <button onclick="loadCourse(1)">DFCA</button>
    <button onclick="loadCourse(2)">ADS</button> -->




</div>

<!-- ================================================= -->
<!-- FULL PUBLIC UI (PRESERVED FOR FUTURE) -->
<!-- ================================================= -->
<div id="full-ui" style="display:none;">

    <label>University</label>
    <select id="university">
        <option value="">Select University</option>
    </select>

    <label>Program</label>
    <select id="program">
        <option value="">Select Program</option>
    </select>

    <label>Stream</label>
    <select id="stream">
        <option value="">Select Stream</option>
    </select>

    <label>Scheme</label>
    <select id="scheme">
        <option value="">Select Scheme</option>
    </select>

    <label>Semester</label>
    <select id="semester">
        <option value="">Select Semester</option>
    </select>

    <label>Course</label>
    <select id="course">
        <option value="">Select Course</option>
    </select>

    <div id="syllabus"></div>

    <div id="progressBox">
        <strong>Progress: <span id="progressText">0%</span></strong>
        <div id="progressBarOuter">
            <div id="progressBar"></div>
        </div>
    </div>
</div>

<script>
/* ---------- MODE SWITCH ---------- */
if (PERSONAL_MODE) {
    document.getElementById("personal-ui").style.display = "block";
} else {
    document.getElementById("full-ui").style.display = "block";
}

/* ---------- SHARED LOGIC ---------- */
function loadCourse(courseId) {

    const syllabusDiv = document.getElementById("syllabus");
    syllabusDiv.innerHTML = "";
    let total = 0;

    fetch(`/api/syllabus?course_id=${courseId}`)
        .then(res => res.json())
        .then(data => {

            data.forEach(m => {
                syllabusDiv.innerHTML += `<h3>${m.module} (${m.hours} hrs)</h3>`;
                m.topics.forEach(t => {
                    total++;
                    syllabusDiv.innerHTML += `
                        <div class="topic">
                            <input type="checkbox"
                                   class="topicCheck"
                                   data-topic-id="${t.id}">
                            ${t.name}
                        </div>
                    `;
                });
            });

            fetch(`/api/progress/${courseId}`)
                .then(res => res.json())
                .then(saved => {
                    saved.forEach(p => {
                        const cb = document.querySelector(
                            `[data-topic-id="${p.topic_id}"]`
                        );
                        if (cb) cb.checked = p.completed;
                    });
                    updateProgress();
                });

            document.querySelectorAll(".topicCheck").forEach(cb => {
                cb.onchange = () => {
                    fetch("/api/progress", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            topic_id: cb.dataset.topicId,
                            completed: cb.checked
                        })
                    });
                    updateProgress();
                };
            });

            function updateProgress() {
                const done = document.querySelectorAll(".topicCheck:checked").length;
                const percent = Math.round((done / total) * 100);
                document.getElementById("progressText").innerText = percent + "%";
                document.getElementById("progressBar").style.width = percent + "%";
            }
        });
}
// Auto-load ADS syllabus on page load
document.addEventListener("DOMContentLoaded", () => {

    loadCourse(3);
});
// Auto-load ADS syllabus on page load


function loadFiles(path = "") {

    const url = path ? `/api/files/${path}` : `/api/files`;

    fetch(url)
        .then(res => res.json())
        .then(data => {

            const list = document.getElementById("fileList");
            list.innerHTML = "";

            // BACK BUTTON
            if (path !== "") {
                const back = document.createElement("li");
                back.textContent = "⬅ Back";
                back.onclick = () => {
                    const parent = path.split("/").slice(0, -1).join("/");
                    loadFiles(parent);
                };
                list.appendChild(back);
            }

            // 🔥 EMPTY FOLDER CHECK (CORRECT PLACE)
            if (data.length === 0) {
                const emptyMessage = document.createElement("li");
                emptyMessage.textContent = "📭 No records found";
                emptyMessage.className = "empty-folder";
                list.appendChild(emptyMessage);
                return;
            }

            // FILE / FOLDER LISTING
            data.forEach(item => {

                if (item.name.startsWith("~$")) return;
                if (item.name.endsWith(".docx")) return;

                const li = document.createElement("li");

                if (item.type === "folder") {
                    li.textContent = "📁 " + item.name;
                    li.onclick = () => loadFiles(item.path);
                }
                else if (item.type === "file") {
                    li.textContent = "📄 " + item.name;
                    li.onclick = () => openFile(item.path);
                }

                list.appendChild(li);
            });
        });
}

function openFile(path) {
    document.getElementById("fileViewer").src = `/api/open/${path}`;
}
document.addEventListener("DOMContentLoaded", () => {
    loadFiles();
});

document.addEventListener("DOMContentLoaded", loadFiles);
</script>

</body>
</html>
