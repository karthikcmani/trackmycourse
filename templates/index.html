<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track My Course</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        select {
            width: 320px;
            padding: 6px;
            margin-top: 5px;
        }
        h3 {
            margin-top: 25px;
        }
        .topic {
            margin-left: 15px;
        }
        #progressBox {
            margin-top: 25px;
        }
        #progressBarOuter {
            width: 320px;
            height: 10px;
            background: #eee;
            margin-top: 6px;
        }
        #progressBar {
            height: 10px;
            width: 0%;
            background: #4caf50;
        }
    </style>
</head>
<body>

<h2>Track My Course</h2>

<label>University</label>
<select id="university">
    <option value="">Select University</option>
</select>

<label>Program</label>
<select id="program">
    <option value="">Select Program</option>
</select>

<label>Stream</label>
<select id="stream">
    <option value="">Select Stream</option>
</select>

<label>Scheme</label>
<select id="scheme">
    <option value="">Select Scheme</option>
</select>

<label>Semester</label>
<select id="semester">
    <option value="">Select Semester</option>
</select>

<label>Course</label>
<select id="course">
    <option value="">Select Course</option>
</select>

<!-- SYLLABUS -->
<div id="syllabus"></div>

<!-- PROGRESS -->
<div id="progressBox">
    <strong>Progress: <span id="progressText">0%</span></strong>
    <div id="progressBarOuter">
        <div id="progressBar"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const uni = document.getElementById("university");
    const prog = document.getElementById("program");
    const stream = document.getElementById("stream");
    const scheme = document.getElementById("scheme");
    const sem = document.getElementById("semester");
    const course = document.getElementById("course");
    const syllabusDiv = document.getElementById("syllabus");

    // ---------- LOAD UNIVERSITIES ----------
    fetch("/api/universities")
        .then(res => res.json())
        .then(data => {
            data.forEach(u => {
                uni.innerHTML += `<option value="${u.id}">${u.name}</option>`;
            });
        });

    uni.onchange = () => {
        resetBelow("program");
        fetch(`/api/programs?university_id=${uni.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(p => {
                    prog.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                });
            });
    };

    prog.onchange = () => {
        resetBelow("stream");
        fetch(`/api/streams?program_id=${prog.value}`)
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    loadSchemes();
                } else {
                    data.forEach(s => {
                        stream.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                    });
                }
            });
    };

    stream.onchange = () => loadSchemes(stream.value);

    function loadSchemes(streamId="") {
        resetBelow("scheme");
        let url = `/api/schemes?program_id=${prog.value}`;
        if (streamId) url += `&stream_id=${streamId}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                data.forEach(sc => {
                    scheme.innerHTML += `<option value="${sc.id}">${sc.year}</option>`;
                });
            });
    }

    scheme.onchange = () => {
        resetBelow("semester");
        fetch(`/api/semesters?scheme_id=${scheme.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(s => {
                    sem.innerHTML += `<option value="${s.id}">Semester ${s.semester_no}</option>`;
                });
            });
    };

    sem.onchange = () => {
        resetBelow("course");
        fetch(`/api/courses?semester_id=${sem.value}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(c => {
                    course.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
            });
    };

    // ---------- COURSE → SYLLABUS + PROGRESS ----------
    course.onchange = () => {
        syllabusDiv.innerHTML = "";

        fetch(`/api/syllabus?course_id=${course.value}`)
            .then(res => res.json())
            .then(data => {

                let total = 0;

                data.forEach(m => {
                    syllabusDiv.innerHTML += `<h3>${m.module} (${m.hours} hrs)</h3>`;
                    m.topics.forEach(t => {
                        total++;
                        syllabusDiv.innerHTML += `
                            <div class="topic">
                                <input type="checkbox"
                                       class="topicCheck"
                                       data-topic-id="${t.id}">
                                ${t.name}
                            </div>
                        `;
                    });
                });

                // LOAD SAVED PROGRESS
                fetch(`/api/progress/${course.value}`)
                    .then(res => res.json())
                    .then(saved => {
                        saved.forEach(p => {
                            const cb = document.querySelector(
                                `[data-topic-id="${p.topic_id}"]`
                            );
                            if (cb) cb.checked = p.completed;
                        });
                        updateProgress();
                    });

                // SAVE ON CHANGE
                document.querySelectorAll(".topicCheck").forEach(cb => {
                    cb.onchange = () => {
                        fetch("/api/progress", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                topic_id: cb.dataset.topicId,
                                completed: cb.checked
                            })
                        });
                        updateProgress();
                    };
                });

                function updateProgress() {
                    const done = document.querySelectorAll(".topicCheck:checked").length;
                    const percent = Math.round((done / total) * 100);
                    document.getElementById("progressText").innerText = percent + "%";
                    document.getElementById("progressBar").style.width = percent + "%";
                }
            });
    };

    function resetBelow(level) {
        if (level === "program") prog.innerHTML = '<option value="">Select Program</option>';
        if (["program","stream"].includes(level)) stream.innerHTML = '<option value="">Select Stream</option>';
        if (["program","stream","scheme"].includes(level)) scheme.innerHTML = '<option value="">Select Scheme</option>';
        if (["program","stream","scheme","semester"].includes(level)) sem.innerHTML = '<option value="">Select Semester</option>';
        if (["program","stream","scheme","semester","course"].includes(level)) course.innerHTML = '<option value="">Select Course</option>';
        syllabusDiv.innerHTML = "";
        document.getElementById("progressText").innerText = "0%";
        document.getElementById("progressBar").style.width = "0%";
    }

});
</script>

</body>
</html>
